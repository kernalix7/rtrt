name: coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Re-run weekly so coverage drift surfaces even without a code change.
    - cron: '23 5 * * 1'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  llvm-cov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-llvm-cov
        run: cargo install --locked cargo-llvm-cov
      - name: Run coverage (default features)
        # --fail-under-lines enforces a regression floor. Measured line
        # coverage was ~38% when the floor was introduced; keep the floor a
        # few points below the last measured value and ratchet it up as
        # coverage improves — never down.
        run: |
          cargo llvm-cov --workspace \
            --lcov --output-path lcov.info \
            --fail-under-lines 35 \
            --ignore-filename-regex '(benches|tests|examples)/'
      - name: Summary
        run: cargo llvm-cov report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: error
