name: bench

# Runs the compress criterion harness on a schedule so we notice perf drift
# (or savings regressions on the fixture corpus) without lengthening every PR
# build. Not blocking; artefact-only.

on:
  workflow_dispatch:
  schedule:
    - cron: '47 6 * * 1'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  compress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: cargo bench (compress)
        run: cargo bench -p rtrt-compress --bench compress_bench -- --warm-up-time 1 --measurement-time 5
      - name: Savings table
        run: bash scripts/bench.sh --table-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: criterion-report
          path: target/criterion
          if-no-files-found: warn
